[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudopt"
version = "0.1.0"
description = "AI-powered cloud resource optimization and cost prediction (shared ML/simulation package)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["cloudopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
